[profile.default]
fs_permissions = [{ access = "write", path = "./" }]
always_use_create_2_factory = true
via_ir = true
remappings = [
    "forge-std/=./libs/forge-std/src",
    "openzeppelin/=./libs/openzeppelin/",
    "ds-test/=./libs/ds-test/src",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"